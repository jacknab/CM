# =============================================================================
# Certxa — nginx site config (LIVE / VPS version)
#
# Deploy path on VPS:  /etc/nginx/sites-available/certxa.conf
# Symlink:             /etc/nginx/sites-enabled/certxa.conf
#
# Apply changes:
#   sudo nginx -t                # validate syntax
#   sudo systemctl reload nginx  # zero-downtime reload
#
# Upstream ports (must match the actual systemd services on the VPS):
#   :9200  → certxa-api      (Node.js Express + /media-stream WebSocket)
#   :23795 → webpage-editor  (the website builder / editor app)
#   :3002  → site-router     (PHP site-router that serves *.certxa.com tenant sites
#                             and custom client domains)
#
# If you change any of those ports, update this file in BOTH places (this
# main server block AND the subdomain / catch-all blocks below) — otherwise
# you'll get 502 Bad Gateway on whichever path you missed.
# =============================================================================


# ─── Main application: certxa.com ────────────────────────────────────────────
server {
    listen 80;
    server_name certxa.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name certxa.com;

    ssl_certificate     /etc/letsencrypt/live/certxa.com-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/certxa.com-0001/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;

    # Allow image / avatar / logo uploads from the admin & owner UIs.
    client_max_body_size 25m;

    # ── AI Receptionist — Twilio bi-directional audio WebSocket ──────────────
    # This MUST be a separate location block with a long read timeout.
    # Twilio holds this connection open for the entire duration of a phone call.
    # Without proxy_read_timeout 3600s, Nginx will kill the connection after
    # its default 60 s, cutting off the caller mid-conversation.
    #
    # NOTE: The Node process verifies inbound Twilio webhooks via X-Twilio-Signature.
    # That check requires the EXACT public URL Twilio used — which is why we forward
    # Host + X-Forwarded-Proto here so APP_URL on the server reconstructs to https.
    # If TWILIO_AUTH_TOKEN is unset in .env.production the signature check is
    # SKIPPED with a startup warning (do not run that way in production).
    location /media-stream {
        proxy_pass         http://localhost:9200;
        proxy_http_version 1.1;

        # WebSocket upgrade handshake — required
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Keep the WebSocket alive for up to 1 hour (full call duration)
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 10s;
    }

    # ── /ws — WebSocket notifications / sync ──────────────────────────────────────
    # The booking SPA opens WebSocket connections at /ws/notifications?storeId=N
    # for real-time turn queue updates, appointment sync, etc.
    location /ws {
        proxy_pass         http://localhost:9200;
        proxy_http_version 1.1;

        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;

        proxy_read_timeout    86400s;
        proxy_send_timeout    86400s;
        proxy_connect_timeout 10s;

        proxy_buffering off;
    }

    # ── API backend ──────────────────────────────────────────────────────────
    # All /api/* including /api/webhook/twilio (the inbound call hook),
    # /api/admin/stores/:id/ai-receptionist (provisioning), /api/auth/*, etc.
    location /api/ {
        proxy_pass         http://localhost:9200;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";   # HTTP keep-alive to Node

        proxy_cache_bypass $http_upgrade;
    }

    # ── Main webpage editor application ──────────────────────────────────────
    # The /admin, /isadmin, /ai-receptionist, /calendar etc. routes all land here.
    location / {
        proxy_pass         http://localhost:23795;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}


# ─── Client subdomains: *.certxa.com ─────────────────────────────────────────
# Every tenant gets <slug>.certxa.com which the PHP site-router renders.
server {
    listen 80;
    server_name ~^(?<subdomain>.+)\.certxa\.com$;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ~^(?<subdomain>.+)\.certxa\.com$;

    ssl_certificate     /etc/letsencrypt/live/certxa.com-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/certxa.com-0001/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;

    client_max_body_size 25m;

    # API calls made by the rendered tenant site (relative /api/… URLs)
    location /api/ {
        proxy_pass         http://localhost:9200;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_cache_bypass $http_upgrade;
    }

    # Template and static assets via PHP site-router
    location / {
        proxy_pass         http://localhost:3002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}


# ─── Custom client domains — catch-all (HTTP) ────────────────────────────────
# Clients who point their own domain (CNAME / A record) at this VPS land here.
# Add a separate SSL server block per custom domain via Certbot when issuing certs.
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 25m;

    # API calls made by the rendered tenant site
    location /api/ {
        proxy_pass         http://localhost:9200;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_cache_bypass $http_upgrade;
    }

    # Template via PHP site-router
    location / {
        proxy_pass         http://localhost:3002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
