<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#ffffff"/>
  <rect x="0" y="0" width="6" height="630" fill="#7C3AED"/>
  <!-- Background X watermark -->
  <text x="900" y="580" font-family="sans-serif" font-size="520" font-weight="900" fill="#7C3AED" opacity="0.06" text-anchor="middle">×</text>
  <!-- Brand name -->
  <text x="100" y="280" font-family="sans-serif" font-size="96" font-weight="800" fill="#111111" letter-spacing="-2">Certxa</text>
  <!-- Tagline -->
  <text x="100" y="360" font-family="sans-serif" font-size="32" font-weight="400" fill="#6B7280">All-in-one salon software</text>
  <!-- Divider -->
  <rect x="100" y="400" width="80" height="4" fill="#7C3AED" rx="2"/>
  <!-- Sub-line -->
  <text x="100" y="460" font-family="sans-serif" font-size="24" font-weight="400" fill="#9CA3AF">Bookings · Payments · Clients · Analytics</text>
</svg>
