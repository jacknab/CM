# =============================================================================
# Certxa — nginx site config (http-context include)
#
# Deploy path: /etc/nginx/conf.d/certxa.conf
#   (included inside the http {} block of the main /etc/nginx/nginx.conf)
#
# Placeholders replaced by setup.sh:
#   __DOMAIN__    → your domain e.g. certxa.com
#   __APP_DIR__   → absolute repo path e.g. /var/www/certxa
#   __API_PORT__  → Express API port (default 8080)
#
# Routes:
#   /api/*             → Express API server (Node.js, port __API_PORT__)
#   /website-builder/* → Website Builder SPA (static files)
#   /*                 → Booking App SPA (static files)
# =============================================================================

# -- rate limiting ------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=certxa_api:10m    rate=60r/s;
limit_req_zone $binary_remote_addr zone=certxa_auth:10m   rate=20r/m;
limit_req_zone $binary_remote_addr zone=certxa_static:10m rate=200r/s;
limit_conn_zone $binary_remote_addr zone=certxa_conn:10m;

# -- upstream: Node.js API ----------------------------------------------------
upstream certxa_api {
    server 127.0.0.1:__API_PORT__;
    keepalive 64;
}

# -- HTTP → HTTPS redirect ----------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -- HTTPS main server --------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__ www.__DOMAIN__;

    # -- SSL (managed by Certbot — do not edit these lines manually) ----------
    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # -- security headers -----------------------------------------------------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options           "SAMEORIGIN"                                   always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header X-XSS-Protection          "1; mode=block"                                always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(self)" always;

    # -- request size & timeouts ----------------------------------------------
    client_max_body_size    25m;
    client_body_timeout     30s;
    client_header_timeout   15s;
    send_timeout            30s;
    proxy_read_timeout      60s;
    proxy_send_timeout      30s;
    proxy_connect_timeout   10s;

    limit_conn certxa_conn 100;
    limit_req_status 429;

    # ── /ws — WebSocket notifications / sync ──────────────────────────────────────
    # The booking SPA opens WebSocket connections at /ws/notifications?storeId=N
    # for real-time turn queue updates, appointment sync, etc.
    # Must use HTTP/1.1 + Upgrade headers for the 101 handshake.
    location /ws {
        limit_req zone=certxa_api burst=120 nodelay;

        proxy_pass         http://certxa_api;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout    86400s;
        proxy_send_timeout    86400s;
        proxy_connect_timeout 10s;

        proxy_buffering off;
    }

    # ── /media-stream — Twilio AI Receptionist WebSocket ───────────────────
    # Twilio opens a persistent WSS connection here for the audio stream.
    # Must be proxied with the Upgrade/Connection headers so Node can perform
    # the HTTP→WebSocket handshake.
    location /media-stream {
        proxy_pass         http://certxa_api;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeout — audio streams stay open for the full call duration
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;

        # No buffering on a live audio stream
        proxy_buffering off;
    }

    # ── SSE endpoint — must come before /api to override buffering ─────────
    # HTTP/2 + proxy buffering kills SSE (ERR_HTTP2_PROTOCOL_ERROR).
    # Dedicate a location with buffering off and a long read timeout.
    location = /api/appointments/sse {
        proxy_pass         http://certxa_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Tell nginx not to buffer upstream SSE events
        add_header X-Accel-Buffering no;
    }

    # ── /api — Express API server ────────────────────────────────────────────
    location /api {
        limit_req zone=certxa_api burst=120 nodelay;

        proxy_pass         http://certxa_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_buffering    on;
        proxy_buffer_size  8k;
        proxy_buffers      16 8k;

        proxy_hide_header X-Powered-By;
    }

    # Tighter limit on auth routes
    location ~ ^/api/auth {
        limit_req zone=certxa_auth burst=20 nodelay;

        proxy_pass         http://certxa_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # ── /videos — PHP site product videos ──────────────────────────────────
    # These live in php/videos/ in the repo. Nginx serves them directly
    # (not via Node/PHP) for performance. Range requests are handled here
    # so browsers can stream and seek without needing PHP's serve_static.
    location /videos/ {
        alias __APP_DIR__/php/videos/;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=86400";
        expires 1d;
        access_log off;
    }

    # ── /assets/img — PHP site static images ────────────────────────────────
    # Falls back to @certxa_node for assets not found in the booking dist,
    # but php/assets/img/ images (hero scenes, etc.) are served directly.
    location /assets/img/ {
        alias __APP_DIR__/php/assets/img/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri @certxa_node;
    }

    # ── /website-builder — Website Builder SPA ──────────────────────────────
    location ^~ /website-builder/assets/ {
        alias __APP_DIR__/artifacts/website-builder/dist/public/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary Accept-Encoding;
        access_log off;
        try_files $uri =404;
    }

    location ^~ /website-builder/ {
        limit_req zone=certxa_static burst=400 nodelay;
        alias __APP_DIR__/artifacts/website-builder/dist/public/;
        try_files $uri $uri/ @website_builder_spa;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location @website_builder_spa {
        internal;
        root __APP_DIR__/artifacts/website-builder/dist/public;
        try_files /index.html =404;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ── /nail-salons/nearby.json — salon directory proximity search ──────────
    # This endpoint is served by Node.js (salonDirectory router) and its URL ends
    # in .json, which would otherwise be intercepted by the `~* \.(webmanifest|json)$`
    # location inside `location /` and served as the booking SPA index.html.
    # An exact-match location has higher precedence than regex matches, so this
    # ensures the request reaches Node.js rather than receiving SPA HTML.
    location = /nail-salons/nearby.json {
        limit_req zone=certxa_api burst=120 nodelay;

        proxy_pass         http://certxa_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        # Allow caching — the nearby endpoint sets Cache-Control: public, max-age=300
        proxy_buffering on;
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
    }

    # ── Exact root — served by Node.js/PHP, never the SPA ───────────────────
    # Sending GET / to the upstream Node.js server lets Express route it to
    # the PHP middleware which renders index.php (the marketing landing page)
    # directly in the response.  No client-side redirect fires, so Google
    # crawls certxa.com/ without the /overview bounce.
    location = / {
        proxy_pass         http://certxa_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # ── / — Booking App SPA ──────────────────────────────────────────────────
    location / {
        limit_req zone=certxa_static burst=400 nodelay;

        root __APP_DIR__/artifacts/booking/dist/public;

        # try_files falls back to Node.js (@certxa_node) for any file not
        # present in the booking dist — lets PHP-served images (e.g.
        # /assets/kiosk-*.png) pass through to the Node/PHP proxy.
        location ~* ^/assets/ {
            root __APP_DIR__/artifacts/booking/dist/public;
            try_files $uri @certxa_node;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Vary Accept-Encoding;
            access_log off;
        }

        location ~* \.(webmanifest|json)$ {
            root __APP_DIR__/artifacts/booking/dist/public;
            try_files $uri /index.html;
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
        }

        # Route misses to Node so it can decide between booking SPA fallback
        # and PHP marketing pages (/overview, /pricing, etc.) via php-proxy.
        try_files $uri $uri/ @certxa_node;

        location ~* \.html$ {
            root __APP_DIR__/artifacts/booking/dist/public;
            try_files $uri /index.html;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # ── @certxa_node — named fallback proxy to Node.js ───────────────────────
    # Used by try_files fallbacks so PHP-served /assets/ files reach Node.js.
    location @certxa_node {
        proxy_pass         http://certxa_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # ── error pages ──────────────────────────────────────────────────────────
    # Do not remap 404s to /index.html at nginx layer; that can cause
    # internal redirect loops when index.html is absent/stale.
    # Node handles SPA fallback and PHP routing safely.
    # error_page 404             /index.html;
    error_page 429             @too_many_requests;
    error_page 500 502 503 504 @server_error;

    location @too_many_requests {
        default_type application/json;
        return 429 '{"error":"Too many requests. Please slow down."}';
    }

    location @server_error {
        default_type application/json;
        return 500 '{"error":"An unexpected server error occurred."}';
    }
}

