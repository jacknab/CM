# ─────────────────────────────────────────────────────────────────────────────
# certxa.com — Nginx configuration
#
# voice.certxa.com  →  AI receptionist (Certxa API, port 5000)
# *.certxa.com      →  Website builder app          (port 5005)
#
# SSL cert covers all subdomains (*.certxa.com wildcard).
# More-specific server_name blocks win, so voice.certxa.com is never
# caught by the wildcard block.
# ─────────────────────────────────────────────────────────────────────────────


# ── Shared SSL settings (used in both 443 blocks) ────────────────────────────
# Referenced via ssl_certificate / include directives in each block.


# ─────────────────────────────────────────────────────────────────────────────
# 1.  voice.certxa.com  →  AI receptionist
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name voice.certxa.com;

    # SSL — same cert as the rest of certxa.com (wildcard covers subdomains)
    ssl_certificate     /etc/letsencrypt/live/certxa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/certxa.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Twilio inbound webhook (HTTP POST) ───────────────────────────────────
    # Twilio calls this when someone dials your number.
    # e.g. https://voice.certxa.com/api/webhook/twilio?storeId=1
    location /api/webhook/twilio {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Twilio webhooks are short-lived HTTP requests — modest timeouts are fine
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # ── Twilio media stream (WebSocket) ──────────────────────────────────────
    # Twilio opens a persistent WebSocket here to stream audio both ways.
    # Must stay alive for the full call duration — use long timeouts.
    location /media-stream {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Disable buffering — audio must flow in real time
        proxy_buffering    off;

        # Keep the WebSocket alive for up to 1 hour (longest realistic call)
        proxy_connect_timeout  10s;
        proxy_send_timeout     3600s;
        proxy_read_timeout     3600s;
    }

    # ── Block everything else ─────────────────────────────────────────────────
    # voice.certxa.com is for AI calls only — no other routes exposed.
    location / {
        return 404;
    }
}


# ─────────────────────────────────────────────────────────────────────────────
# 2.  *.certxa.com + certxa.com  →  Website builder app
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name *.certxa.com certxa.com;

    root  /opt/booking3/dist/public;
    index index.html;

    # SSL
    ssl_certificate     /etc/letsencrypt/live/certxa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/certxa.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Favicon and robots.txt — no fallback to index.html
    location = /favicon.ico {
        try_files $uri =404;
    }

    location = /robots.txt {
        try_files $uri =404;
    }

    # SPA — serve index.html for all client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the website builder backend
    location /api/ {
        proxy_pass         http://127.0.0.1:5005;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}


# ─────────────────────────────────────────────────────────────────────────────
# 3.  HTTP → HTTPS redirect (all subdomains)
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name *.certxa.com certxa.com;
    return 301 https://$host$request_uri;
}
