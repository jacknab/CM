# =============================================================================
# Certxa — nginx configuration
#
# Placeholders (replaced by setup.sh, or edit manually before use):
#   __DOMAIN__    → your domain e.g. certxa.com
#   __APP_DIR__   → absolute path to repo e.g. /var/www/certxa
#   __API_PORT__  → Express API port (default 8080)
#
# Routes:
#   /api/*             → Express API server (Node.js, port __API_PORT__)
#   /website-builder/* → Website Builder SPA (static, React/Vite)
#   /*                 → Booking App SPA (static, React/Vite)
# =============================================================================

# -- worker tuning ------------------------------------------------------------
worker_processes auto;
worker_rlimit_nofile 65535;
pid /run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    # -- MIME / charset -------------------------------------------------------
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;

    # -- logging --------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/certxa-access.log main buffer=16k flush=5s;
    error_log  /var/log/nginx/certxa-error.log warn;

    # -- performance ----------------------------------------------------------
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    keepalive_requests  1000;
    types_hash_max_size 2048;
    server_tokens       off;

    # -- gzip compression -----------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.ms-fontobject
        application/wasm
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/eot
        font/opentype
        font/otf
        image/bmp
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/calendar
        text/css
        text/javascript
        text/markdown
        text/plain
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/xml;

    # -- rate limiting --------------------------------------------------------
    # General API rate limit: 60 req/s per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/s;
    # Auth endpoints: 20 req/m per IP, burst of 20 so a mobile app owner
    # whose session just expired can log in again without hitting a 429.
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=20r/m;
    # Static assets: generous limit
    limit_req_zone $binary_remote_addr zone=static_limit:10m rate=200r/s;

    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    limit_conn conn_limit 100;

    # -- upstream: Node.js API ------------------------------------------------
    upstream certxa_api {
        server 127.0.0.1:__API_PORT__;
        keepalive 64;
    }

    # -- HTTP → HTTPS redirect ------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name __DOMAIN__ www.__DOMAIN__;

        # Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/letsencrypt;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # -- HTTPS main server ----------------------------------------------------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name __DOMAIN__ www.__DOMAIN__;

        # -- SSL (managed by Certbot — do not edit these lines manually) ------
        ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
        include             /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

        # -- security headers -------------------------------------------------
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options           "SAMEORIGIN"                                   always;
        add_header X-Content-Type-Options    "nosniff"                                      always;
        add_header X-XSS-Protection          "1; mode=block"                                always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(self)" always;

        # -- request size & timeouts ------------------------------------------
        client_max_body_size    25m;
        client_body_timeout     30s;
        client_header_timeout   15s;
        send_timeout            30s;
        proxy_read_timeout      60s;
        proxy_send_timeout      30s;
        proxy_connect_timeout   10s;

        # ── /media-stream — Twilio AI Receptionist WebSocket ─────────────────
        # Twilio opens a persistent WSS connection here for the audio stream.
        # Must be proxied with the Upgrade/Connection headers so Node can perform
        # the HTTP→WebSocket handshake. No rate limiting — Twilio is the only
        # client and its connection pattern is not request-based.
        location /media-stream {
            proxy_pass         http://certxa_api;
            proxy_http_version 1.1;

            # WebSocket upgrade headers — mandatory for the 101 handshake
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Long timeout — audio streams stay open for the full call duration
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;

            # No buffering on a live audio stream
            proxy_buffering off;
        }

        # ── /ws — WebSocket notifications / sync ──────────────────────────────────────
        # The booking SPA opens WebSocket connections at /ws/notifications?storeId=N
        # for real-time turn queue updates, appointment sync, etc.
        # Must use HTTP/1.1 + Upgrade headers for the 101 Switching Protocols handshake.
        location /ws {
            proxy_pass         http://certxa_api;
            proxy_http_version 1.1;

            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;

            proxy_read_timeout    86400s;
            proxy_send_timeout    86400s;
            proxy_connect_timeout 10s;

            proxy_buffering off;
        }

        # ── Stripe webhooks — must precede generic /api block ─────────────────
        # No rate-limiting: Stripe retries on failure and a 503 from limit_req
        # causes the dashboard to mark the endpoint as "not reachable".
        # proxy_request_buffering off: streams the raw body straight to Express
        # without nginx accumulating it first — required for signature verification.
        location ~ ^/api/stripe/(webhook|connect-webhook)$ {
            proxy_pass              http://certxa_api;
            proxy_http_version      1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";

            # Stream request body directly — do not buffer before forwarding
            proxy_request_buffering off;

            # Give the handler enough time to process the event
            proxy_read_timeout      30s;
            proxy_send_timeout      30s;

            # No response buffering needed for small JSON replies
            proxy_buffering         off;
        }

        # ── SSE endpoint — must come before /api to override buffering ─────
        # HTTP/2 + proxy buffering kills SSE (ERR_HTTP2_PROTOCOL_ERROR).
        location = /api/appointments/sse {
            proxy_pass         http://certxa_api;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header Connection        "";

            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            add_header X-Accel-Buffering no;
        }

        # ── /api — Express API server ─────────────────────────────────────────
        location /api {
            limit_req zone=api_limit burst=120 nodelay;

            proxy_pass         http://certxa_api;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header Connection        "";  # keep-alive to upstream

            proxy_buffering    on;
            proxy_buffer_size  8k;
            proxy_buffers      16 8k;

            # Hide internal headers
            proxy_hide_header X-Powered-By;
        }

        # Tighter limit on auth routes
        location ~ ^/api/auth {
            limit_req zone=auth_limit burst=20 nodelay;

            proxy_pass         http://certxa_api;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
        }

        # ── /videos — PHP site product videos ──────────────────────────────────
        # These live in php/videos/ in the repo. Serve directly so hero/background
        # videos don't fall into the booking SPA fallback (/index.html).
        location /videos/ {
            alias __APP_DIR__/php/videos/;
            add_header Accept-Ranges bytes;
            add_header Cache-Control "public, max-age=86400";
            expires 1d;
            access_log off;
        }

        # ── /assets/img — PHP site static images ───────────────────────────────
        # Serve marketing/PHP image assets directly with Node fallback for misses.
        location /assets/img/ {
            alias __APP_DIR__/php/assets/img/;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            access_log off;
            try_files $uri @certxa_node;
        }

        # ── /sitemap.xml — Main sitemap index ──────────────────────────────────
        # Serve static XML sitemap index directly from PHP directory.
        location = /sitemap.xml {
            alias __APP_DIR__/php/sitemap.xml;
            add_header Content-Type "application/xml; charset=utf-8";
            add_header Cache-Control "public, max-age=3600";
            access_log off;
        }

        # ── /sitemap-pages.xml — Static pages sitemap ──────────────────────────
        location = /sitemap-pages.xml {
            alias __APP_DIR__/php/sitemap-pages.xml;
            add_header Content-Type "application/xml; charset=utf-8";
            add_header Cache-Control "public, max-age=3600";
            access_log off;
        }

        # ── /blog/sitemap.xml — Dynamic blog sitemap (PHP) ─────────────────────
        # Must be proxied to Node/PHP so the PHP script executes and generates XML.
        location = /blog/sitemap.xml {
            proxy_pass         http://certxa_api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # ── /website-builder — Website Builder SPA ────────────────────────────
        location ^~ /website-builder/assets/ {
            alias __APP_DIR__/artifacts/website-builder/dist/public/assets/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Vary Accept-Encoding;
            access_log off;
            try_files $uri =404;
        }

        location ^~ /website-builder/ {
            limit_req zone=static_limit burst=400 nodelay;
            alias __APP_DIR__/artifacts/website-builder/dist/public/;
            try_files $uri $uri/ @website_builder_spa;
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
        }

        location @website_builder_spa {
            internal;
            root __APP_DIR__/artifacts/website-builder/dist/public;
            try_files /index.html =404;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # ── Exact root — served by Node.js/PHP, never the SPA ───────────────────
        # Sending GET / to the upstream Node.js server lets Express route it to
        # the PHP middleware which renders index.php (the marketing landing page)
        # directly in the response.  No client-side redirect fires, so Google
        # crawls certxa.com/ without the /overview bounce.
        location = / {
            proxy_pass         http://certxa_api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
        }

        # ── / — Booking App SPA ───────────────────────────────────────────────
        location / {
            limit_req zone=static_limit burst=400 nodelay;

            root __APP_DIR__/artifacts/booking/dist/public;

            # Vite-hashed assets: cache forever.
            # try_files falls back to Node.js (@certxa_node) for any file not
            # present in the booking dist — this lets PHP-served images (e.g.
            # /assets/kiosk-*.png) pass through to the Node/PHP proxy instead
            # of returning a 404 from Nginx directly.
            location ~* ^/assets/ {
                root __APP_DIR__/artifacts/booking/dist/public;
                try_files $uri @certxa_node;
                expires 1y;
                add_header Cache-Control "public, immutable";
                add_header Vary Accept-Encoding;
                access_log off;
            }

            # Manifests & service workers: short cache
            location ~* \.(webmanifest|json)$ {
                root __APP_DIR__/artifacts/booking/dist/public;
                try_files $uri /index.html;
                expires 1h;
                add_header Cache-Control "public, max-age=3600";
            }

            # SPA fallback — all unknown paths → index.html
            try_files $uri $uri/ /index.html;

            # HTML: no cache
            location ~* \.html$ {
                root __APP_DIR__/artifacts/booking/dist/public;
                try_files $uri /index.html;
                expires -1;
                add_header Cache-Control "no-store, no-cache, must-revalidate";
            }

            expires 1h;
            add_header Cache-Control "public, max-age=3600";
        }

        # ── @certxa_node — named fallback proxy to Node.js ───────────────────
        # Used by try_files fallbacks (e.g. /assets/ files not in booking dist)
        # so that PHP-served static files still reach the Node/PHP middleware.
        location @certxa_node {
            proxy_pass         http://certxa_api;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
        }

        # ── error pages ───────────────────────────────────────────────────────
        error_page 404              /index.html;
        error_page 429              @too_many_requests;
        error_page 500 502 503 504  @server_error;

        location @too_many_requests {
            default_type application/json;
            return 429 '{"error":"Too many requests. Please slow down."}';
        }

        location @server_error {
            default_type application/json;
            return 500 '{"error":"An unexpected server error occurred."}';
        }
    }

    # -- HTTP-only fallback (use when --no-ssl / before Certbot) ---------------
    # Uncomment this block and comment out the two servers above if you are
    # not yet using SSL (e.g. first-time setup without a domain pointed yet).
    #
    # server {
    #     listen 80 default_server;
    #     listen [::]:80 default_server;
    #     server_name _;
    #
