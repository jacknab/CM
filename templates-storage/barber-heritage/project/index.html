<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0d0b" />

    <!--
      Placeholders for the template's own preview. On a shop's site the server (api-server lib/template-serve.ts)
      replaces the title, description, keywords, canonical, Open Graph, Twitter, geo tags and the structured data with
      the shop's own (lib/salonSeo.ts), and adds its readable summary for search engines and AI assistants.
    -->
    <title>Heritage — Barbershop Website</title>
    <meta name="title" content="Heritage — Barbershop Website" />
    <meta name="description" content="A premium barbershop website: services and prices, gallery, reviews, hours and online booking." />
    <meta name="keywords" content="barbershop, haircut, fade, beard trim, hot towel shave, book online" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://certxa.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://certxa.com/" />
    <meta property="og:title" content="Heritage — Barbershop Website" />
    <meta property="og:description" content="A premium barbershop website: services and prices, gallery, reviews, hours and online booking." />
    <meta property="og:image" content="https://images.pexels.com/photos/1813272/pexels-photo-1813272.jpeg?auto=compress&cs=tinysrgb&w=1200&h=630&fit=crop" />
    <meta property="og:site_name" content="Heritage" />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Heritage — Barbershop Website" />
    <meta name="twitter:description" content="A premium barbershop website: services and prices, gallery, reviews, hours and online booking." />
    <meta name="twitter:image" content="https://images.pexels.com/photos/1813272/pexels-photo-1813272.jpeg?auto=compress&cs=tinysrgb&w=1200&h=630&fit=crop" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <script type="application/ld+json">{"@context":"https://schema.org","@type":"BarberShop","name":"Heritage"}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
