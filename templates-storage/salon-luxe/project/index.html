<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#c92a5e" />

    <!--
      Placeholders for the template's own preview. On a salon's site the server (api-server lib/template-serve.ts)
      replaces the title, description, keywords, canonical, Open Graph, Twitter, geo tags and the structured data with
      the salon's own (lib/salonSeo.ts), and adds its readable summary for search engines and AI assistants.
    -->
    <title>Luxe — Nail Salon Website</title>
    <meta name="title" content="Luxe — Nail Salon Website" />
    <meta name="description" content="A premium nail salon website: services and prices, gallery, reviews, hours and online booking." />
    <meta name="keywords" content="nail salon, manicure, pedicure, gel nails, nail art, book online" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://certxa.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://certxa.com/" />
    <meta property="og:title" content="Luxe — Nail Salon Website" />
    <meta property="og:description" content="A premium nail salon website: services and prices, gallery, reviews, hours and online booking." />
    <meta property="og:image" content="https://images.pexels.com/photos/36328527/pexels-photo-36328527.jpeg?auto=compress&cs=tinysrgb&w=1200&h=630&fit=crop" />
    <meta property="og:site_name" content="Luxe" />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Luxe — Nail Salon Website" />
    <meta name="twitter:description" content="A premium nail salon website: services and prices, gallery, reviews, hours and online booking." />
    <meta name="twitter:image" content="https://images.pexels.com/photos/36328527/pexels-photo-36328527.jpeg?auto=compress&cs=tinysrgb&w=1200&h=630&fit=crop" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <script type="application/ld+json">{"@context":"https://schema.org","@type":"NailSalon","name":"Luxe"}</script>
  </head>
